<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="monospace" font-size="12">
  <text x="450" y="20" text-anchor="middle" font-size="14" font-weight="bold">TC6: Multi-Sharer Stale Read</text>

  <rect x="10" y="35" width="90" height="20" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="55" y="50" text-anchor="middle" font-size="10">Node0 CPU</text>

  <rect x="10" y="65" width="90" height="20" rx="3" fill="#fff3e0" stroke="#e65100"/>
  <text x="55" y="80" text-anchor="middle" font-size="10">UBCC@N2</text>

  <rect x="10" y="95" width="90" height="20" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="55" y="110" text-anchor="middle" font-size="10">Node1/2 CPUs</text>

  <line x1="110" y1="55" x2="880" y2="55" stroke="#ddd" stroke-width="1"/>
  <line x1="110" y1="75" x2="880" y2="75" stroke="#ddd" stroke-width="1"/>
  <line x1="110" y1="105" x2="880" y2="105" stroke="#ddd" stroke-width="1"/>

  <rect x="130" y="33" width="140" height="24" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="200" y="50" text-anchor="middle" font-size="10">write 0xDEADBEEF →</text>

  <rect x="275" y="63" width="150" height="24" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="350" y="80" text-anchor="middle" font-size="10">grant M, pendingOp=3, req=N0</text>

  <rect x="470" y="93" width="110" height="24" rx="3" fill="#ffcdd2" stroke="#c62828"/>
  <text x="525" y="110" text-anchor="middle" font-size="10">Node1 read → block</text>

  <rect x="585" y="93" width="110" height="24" rx="3" fill="#ffcdd2" stroke="#c62828"/>
  <text x="640" y="110" text-anchor="middle" font-size="10">Node2 read → block</text>

  <rect x="700" y="63" width="140" height="24" rx="3" fill="#ffcdd2" stroke="#c62828"/>
  <text x="770" y="80" text-anchor="middle" font-size="10">both dummy S →  0x0</text>

  <text x="20" y="145" font-size="10" fill="#666">T0: Node0 writes 0xDEADBEEF → UBCC grants Modified, pendingOp=3, pendingRequester=0</text>
  <text x="20" y="160" font-size="10" fill="#666">T1: Node1 reads → pendingRequester=0 ≠ 1 → blocked → dummy Shared → phys_mem=0x0 → FAIL</text>
  <text x="20" y="175" font-size="10" fill="#666">T2: Node2 reads → same → blocked → dummy Shared → 0x0 → FAIL (expected 0xDEADBEEF)</text>
</svg>
