<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"
     viewBox="0 0 1600 1000" role="img"
     aria-labelledby="title description">
  <title id="title">Single gem5 Instance: Ruby Controller Relationships</title>
  <desc id="description">
    Ruby CHI controller relationships for one split-mode gem5 instance. The
    diagram distinguishes logical downstream routing, four-virtual-network
    Ruby message transport, and non-CHI EPBackend bindings. Derived from
    CHI_ubcc_framework.py, CHI_basic_framework_config.py, and CHI_config.py.
  </desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#17365d"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b4c9a"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4"
            orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#168795"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#858b92"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17365d"
                    flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px Inter, "Noto Sans", Arial, sans-serif; fill: #17365d; }
      .subtitle { font: 400 15px Inter, "Noto Sans", Arial, sans-serif; fill: #526273; }
      .section { font: 700 18px Inter, "Noto Sans", Arial, sans-serif; fill: #17365d; }
      .box-title { font: 700 16px Inter, "Noto Sans", Arial, sans-serif; fill: #17365d; }
      .box-text { font: 400 13px Inter, "Noto Sans", Arial, sans-serif; fill: #34495e; }
      .small { font: 400 12px Inter, "Noto Sans", Arial, sans-serif; fill: #526273; }
      .tiny { font: 400 11px Inter, "Noto Sans", Arial, sans-serif; fill: #526273; }
      .white-title { font: 700 16px Inter, "Noto Sans", Arial, sans-serif; fill: white; }
      .white-text { font: 400 12px Inter, "Noto Sans", Arial, sans-serif; fill: white; }
      .logical { fill: none; stroke: #17365d; stroke-width: 2.2; marker-end: url(#arrow-navy); }
      .binding { fill: none; stroke: #6b4c9a; stroke-width: 2.1; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
      .network { fill: none; stroke: #168795; stroke-width: 1.8; stroke-dasharray: 3 5; marker-start: url(#arrow-teal); marker-end: url(#arrow-teal); }
      .legacy { fill: none; stroke: #858b92; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <text x="800" y="44" text-anchor="middle" class="title">Single gem5 Instance: Ruby Controller Relationships</text>
  <text x="800" y="69" text-anchor="middle" class="subtitle">
    Split-mode scope: one local node per process; multiplicity scales with num_sockets
  </text>

  <rect x="28" y="91" width="1544" height="810" rx="18" fill="white"
        stroke="#17365d" stroke-width="2.5"/>
  <text x="52" y="122" class="section">gem5 process boundary</text>

  <!-- Legend -->
  <g transform="translate(1020 108)">
    <rect width="520" height="76" rx="10" fill="#f8fafc" stroke="#c9d3df"/>
    <path d="M20 20 H78" class="logical"/>
    <text x="90" y="25" class="small">logical request routing (downstream_destinations)</text>
    <path d="M20 42 H78" class="network"/>
    <text x="90" y="47" class="small">Ruby CHI MessageBuffer attachment (bidirectional transport)</text>
    <path d="M20 64 H78" class="binding"/>
    <text x="90" y="69" class="small">non-CHI SimObject/backend binding</text>
  </g>

  <!-- CPU-side controllers -->
  <g filter="url(#shadow)">
    <rect x="65" y="155" width="410" height="520" rx="16" fill="#f2f7fb"
          stroke="#4f81bd" stroke-width="2"/>
  </g>
  <text x="85" y="187" class="section">CPU-side CHI RN-F clusters</text>
  <text x="85" y="210" class="small">Default: 2 clusters × 2 CPUs; stack below is per CPU (×4)</text>

  <rect x="105" y="235" width="330" height="58" rx="10" fill="#d9eaf7" stroke="#4f81bd"/>
  <text x="270" y="258" text-anchor="middle" class="box-title">CPU[k]</text>
  <text x="270" y="279" text-anchor="middle" class="box-text">instruction port + data port</text>

  <rect x="95" y="325" width="165" height="62" rx="9" fill="#eaf2f8" stroke="#4f81bd"/>
  <text x="177" y="350" text-anchor="middle" class="box-title">Inst RubySequencer</text>
  <text x="177" y="371" text-anchor="middle" class="tiny">CPU request endpoint</text>
  <rect x="280" y="325" width="165" height="62" rx="9" fill="#eaf2f8" stroke="#4f81bd"/>
  <text x="362" y="350" text-anchor="middle" class="box-title">Data RubySequencer</text>
  <text x="362" y="371" text-anchor="middle" class="tiny">ha_ep_backend binding</text>

  <rect x="105" y="425" width="145" height="72" rx="9" fill="#d9ead3" stroke="#57965c"/>
  <text x="177" y="451" text-anchor="middle" class="box-title">CHI L1I Controller</text>
  <text x="177" y="473" text-anchor="middle" class="box-text">32 KiB instruction cache</text>
  <rect x="290" y="425" width="145" height="72" rx="9" fill="#d9ead3" stroke="#57965c"/>
  <text x="362" y="451" text-anchor="middle" class="box-title">CHI L1D Controller</text>
  <text x="362" y="473" text-anchor="middle" class="box-text">32 KiB data cache</text>

  <rect x="170" y="550" width="200" height="88" rx="11" fill="#b7dfe3" stroke="#168795" stroke-width="1.8"/>
  <text x="270" y="580" text-anchor="middle" class="box-title">Private CHI L2 Controller</text>
  <text x="270" y="603" text-anchor="middle" class="box-text">256 KiB per CPU</text>
  <text x="270" y="622" text-anchor="middle" class="tiny">last-level controller in ClusterCHI_RNF</text>

  <path d="M205 293 V316 H177 V325" class="logical"/>
  <path d="M335 293 V316 H362 V325" class="logical"/>
  <path d="M177 387 V425" class="logical"/>
  <path d="M362 387 V425" class="logical"/>
  <path d="M177 497 V525 H245 V550" class="logical"/>
  <path d="M362 497 V525 H295 V550" class="logical"/>
  <text x="270" y="527" text-anchor="middle" class="tiny">L1 downstream = private L2</text>

  <!-- Ruby network -->
  <g filter="url(#shadow)">
    <rect x="535" y="155" width="385" height="190" rx="16" fill="#17365d" stroke="#102945" stroke-width="2"/>
  </g>
  <text x="727" y="185" text-anchor="middle" class="white-title">Ruby CHI Network</text>
  <text x="727" y="205" text-anchor="middle" class="white-text">Every Ruby controller uses req/rsp/snp/dat In + Out MessageBuffers</text>
  <rect x="565" y="222" width="325" height="25" rx="6" fill="#168795"/>
  <text x="727" y="240" text-anchor="middle" class="white-text">VN0 · Request</text>
  <rect x="565" y="253" width="325" height="25" rx="6" fill="#d97706"/>
  <text x="727" y="271" text-anchor="middle" class="white-text">VN1 · Snoop</text>
  <rect x="565" y="284" width="325" height="25" rx="6" fill="#2878b5"/>
  <text x="727" y="302" text-anchor="middle" class="white-text">VN2 · Response</text>
  <rect x="565" y="315" width="325" height="20" rx="6" fill="#7e4a9b"/>
  <text x="727" y="330" text-anchor="middle" class="white-text">VN3 · Data</text>

  <!-- Home controller -->
  <g filter="url(#shadow)">
    <rect x="575" y="415" width="305" height="120" rx="14" fill="#d9eaf7" stroke="#4f81bd" stroke-width="2"/>
  </g>
  <text x="727" y="447" text-anchor="middle" class="box-title">HN-F Controller[s] + L3</text>
  <text x="727" y="470" text-anchor="middle" class="box-text">one per socket · cache + directory/home state</text>
  <text x="727" y="493" text-anchor="middle" class="box-text">L2 downstream target; EP-RNF/Meta-RNF target</text>
  <text x="727" y="516" text-anchor="middle" class="tiny">same-socket EP-SNF selected for every DSM range</text>

  <!-- Main request route and network attachments -->
  <path d="M370 594 H500 V475 H575" class="logical"/>
  <text x="477" y="463" text-anchor="middle" class="small">L2 downstream = all local HN-F[s]</text>
  <path d="M475 390 H510 V250 H535" class="network"/>
  <text x="493" y="375" transform="rotate(-90 493 375)" class="tiny">L1/L2 network ports</text>
  <path d="M727 415 V345" class="network"/>

  <!-- HN-F downstream service nodes -->
  <rect x="505" y="615" width="245" height="105" rx="12" fill="#d9ead3" stroke="#57965c" stroke-width="1.8"/>
  <text x="627" y="645" text-anchor="middle" class="box-title">L-SNF (CHI Memory Controller)</text>
  <text x="627" y="668" text-anchor="middle" class="box-text">one per node</text>
  <text x="627" y="689" text-anchor="middle" class="tiny">local private + routing + metadata backstore ranges</text>
  <rect x="505" y="758" width="245" height="76" rx="11" fill="#eef5e9" stroke="#57965c"/>
  <text x="627" y="787" text-anchor="middle" class="box-title">Local MemCtrl / DDR4</text>
  <text x="627" y="810" text-anchor="middle" class="box-text">l_memctrl</text>

  <rect x="785" y="615" width="245" height="105" rx="12" fill="#fce4d6" stroke="#c55a11" stroke-width="1.8"/>
  <text x="907" y="645" text-anchor="middle" class="box-title">EP-SNF[s]</text>
  <text x="907" y="668" text-anchor="middle" class="box-text">one per socket · DSM home-service endpoint</text>
  <text x="907" y="689" text-anchor="middle" class="tiny">all DSM home-node ranges for this socket plane</text>

  <path d="M675 535 V580 H627 V615" class="logical"/>
  <text x="594" y="577" text-anchor="middle" class="tiny">local/private/meta</text>
  <path d="M780 535 V580 H907 V615" class="logical"/>
  <text x="877" y="577" text-anchor="middle" class="tiny">DSM</text>
  <path d="M627 720 V758" class="logical"/>
  <path d="M585 615 H550 V365 H690 V345" class="network"/>
  <path d="M950 615 V365 H765 V345" class="network"/>

  <!-- Endpoint requester controllers -->
  <rect x="1035" y="250" width="235" height="98" rx="12" fill="#fff2cc" stroke="#bf9000" stroke-width="1.8"/>
  <text x="1152" y="280" text-anchor="middle" class="box-title">EP-RNF</text>
  <text x="1152" y="303" text-anchor="middle" class="box-text">one per node · DSM endpoint cache participant</text>
  <text x="1152" y="324" text-anchor="middle" class="tiny">downstream = all local HN-F[s]</text>

  <rect x="1035" y="390" width="235" height="98" rx="12" fill="#fff2cc" stroke="#bf9000" stroke-width="1.8"/>
  <text x="1152" y="420" text-anchor="middle" class="box-title">Meta-RNF[s]</text>
  <text x="1152" y="443" text-anchor="middle" class="box-text">one per socket · async metadata requests</text>
  <text x="1152" y="464" text-anchor="middle" class="tiny">downstream = same-socket HN-F</text>

  <path d="M1035 299 H955 V448 H880" class="logical"/>
  <path d="M1035 439 H930 V482 H880" class="logical"/>
  <path d="M1035 274 H960 V220 H920" class="network"/>
  <path d="M1035 414 H980 V235 H920" class="network"/>

  <!-- Backend and adapter -->
  <g filter="url(#shadow)">
    <rect x="1320" y="300" width="205" height="170" rx="14" fill="#e8def5" stroke="#6b4c9a" stroke-width="2"/>
  </g>
  <text x="1422" y="333" text-anchor="middle" class="box-title">EPBackend</text>
  <text x="1422" y="357" text-anchor="middle" class="box-text">shared per node</text>
  <text x="1422" y="383" text-anchor="middle" class="tiny">protocol coordination · retry state</text>
  <text x="1422" y="404" text-anchor="middle" class="tiny">HA store facade · endpoint callbacks</text>
  <text x="1422" y="425" text-anchor="middle" class="tiny">owns per-socket UBAdapter references</text>
  <text x="1422" y="446" text-anchor="middle" class="tiny">not a Ruby controller</text>

  <rect x="1320" y="570" width="205" height="95" rx="12" fill="#e8def5" stroke="#6b4c9a" stroke-width="1.8"/>
  <text x="1422" y="601" text-anchor="middle" class="box-title">UBAdapter[s]</text>
  <text x="1422" y="624" text-anchor="middle" class="box-text">one per socket</text>
  <text x="1422" y="645" text-anchor="middle" class="tiny">message path to external ubio</text>

  <path d="M1270 299 H1295 V345 H1320" class="binding"/>
  <text x="1292" y="286" text-anchor="middle" class="tiny">ep_backend</text>
  <path d="M1270 439 H1320" class="binding"/>
  <text x="1295" y="430" text-anchor="middle" class="tiny">runtime registration</text>
  <path d="M1030 667 H1280 V505 H1360 V470" class="binding"/>
  <text x="1165" y="689" text-anchor="middle" class="tiny">ep_backend</text>
  <path d="M445 356 H485 V887 H1288 V520 H1395 V470" class="binding"/>
  <text x="900" y="880" text-anchor="middle" class="tiny">Data RubySequencer → EPBackend for HA stores</text>
  <path d="M1422 470 V570" class="binding"/>

  <!-- Legacy DL-SNF path -->
  <rect x="1045" y="710" width="225" height="72" rx="11" fill="#f0f1f2" stroke="#858b92" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="1157" y="739" text-anchor="middle" class="box-title" fill="#666">DL-SNF</text>
  <text x="1157" y="761" text-anchor="middle" class="tiny">instantiated Ruby node; not in HN-F downstream list</text>
  <rect x="1045" y="806" width="225" height="56" rx="10" fill="#f7f7f7" stroke="#9aa0a6"/>
  <text x="1157" y="840" text-anchor="middle" class="box-text">DL MemCtrl / DDR4</text>
  <path d="M1157 782 V806" class="legacy"/>
  <path d="M1270 746 H1550 V190 H920" class="legacy"/>
  <text x="1360" y="738" text-anchor="middle" class="tiny">network only</text>

  <!-- Notes -->
  <rect x="70" y="715" width="395" height="135" rx="12" fill="#fffdf5" stroke="#d6c27a"/>
  <text x="90" y="744" class="box-title">Multiplicity and current routing</text>
  <text x="90" y="770" class="small">• Per CPU: 1 L1I, 1 L1D, 1 private L2</text>
  <text x="90" y="793" class="small">• Per socket: 1 HN-F, 1 EP-SNF, 1 Meta-RNF, 1 UBAdapter</text>
  <text x="90" y="816" class="small">• Per node: 1 EP-RNF, 1 L-SNF, 1 DL-SNF, 1 EPBackend</text>
  <text x="90" y="839" class="small">• F1 rule: all DSM requests use EP-SNF, never DL-SNF</text>

  <!-- Outside gem5 -->
  <rect x="1300" y="918" width="245" height="58" rx="11" fill="#fff4ec" stroke="#c55a11" stroke-width="2"/>
  <text x="1422" y="943" text-anchor="middle" class="box-title">UBIOModule / UBCC</text>
  <text x="1422" y="963" text-anchor="middle" class="box-text">outside this gem5 process</text>
  <path d="M1422 665 V918" class="binding"/>
  <text x="1440" y="878" class="tiny">socket-qualified Port</text>

  <text x="55" y="912" class="tiny">Source of truth: gem5/configs/ruby/CHI_ubcc_framework.py and CHI_basic_framework_config.py</text>
  <text x="55" y="932" class="tiny">Solid arrows show request-direction selection; responses, snoops, and data return over the Ruby CHI network.</text>
</svg>
