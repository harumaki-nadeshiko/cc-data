<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" font-family="monospace" font-size="12">
  <text x="475" y="20" text-anchor="middle" font-size="14" font-weight="bold">TC8: Upgrade Invalidate Stale Read</text>

  <rect x="10" y="35" width="90" height="20" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="55" y="50" text-anchor="middle" font-size="10">Node0 CPU</text>

  <rect x="10" y="65" width="90" height="20" rx="3" fill="#fff3e0" stroke="#e65100"/>
  <text x="55" y="80" text-anchor="middle" font-size="10">UBCC@N2</text>

  <rect x="10" y="95" width="90" height="20" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="55" y="110" text-anchor="middle" font-size="10">Node1/2 CPUs</text>

  <rect x="10" y="125" width="90" height="20" rx="3" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="55" y="140" text-anchor="middle" font-size="10">L2 cpu00</text>

  <line x1="110" y1="55" x2="930" y2="55" stroke="#ddd" stroke-width="1"/>
  <line x1="110" y1="75" x2="930" y2="75" stroke="#ddd" stroke-width="1"/>
  <line x1="110" y1="105" x2="930" y2="105" stroke="#ddd" stroke-width="1"/>
  <line x1="110" y1="135" x2="930" y2="135" stroke="#ddd" stroke-width="1"/>

  <!-- P1 -->
  <rect x="130" y="33" width="140" height="24" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="200" y="50" text-anchor="middle" font-size="10">write 0xAAA">→</text>

  <rect x="130" y="123" width="80" height="24" rx="3" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="170" y="140" text-anchor="middle" font-size="10">UD(0xAAA)</text>

  <rect x="275" y="63" width="170" height="24" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="360" y="80" text-anchor="middle" font-size="10">grant M, pendingOp=3, req=N0</text>

  <!-- P2 -->
  <rect x="500" y="93" width="120" height="24" rx="3" fill="#ffcdd2" stroke="#c62828"/>
  <text x="560" y="110" text-anchor="middle" font-size="10">Node1/2 read → block</text>
  <rect x="625" y="63" width="140" height="24" rx="3" fill="#ffcdd2" stroke="#c62828"/>
  <text x="695" y="80" text-anchor="middle" font-size="10">both dummy S → 0xAAA</text>

  <text x="500" y="138" font-size="9" fill="#c62828">still UD(0xAAA) — no SnpShared</text>

  <!-- P3 -->
  <rect x="800" y="63" width="100" height="24" rx="3" fill="#fff9c4" stroke="#f9a825"/>
  <text x="850" y="80" text-anchor="middle" font-size="10">5M timer ↑ pending=0</text>

  <!-- Explanation -->
  <text x="20" y="170" font-size="10" fill="#666">P1: Node0 write 0xAAA → L2=UD(0xAAA), UBCC grants Modified, pendingOp=3, pendingRequester=0</text>
  <text x="20" y="185" font-size="10" fill="#666">P2: Node1/2 read → blocked by pendingOp (requester=1≠0) → dummy Shared → reads 0xAAA (from phys_mem)</text>
  <text x="20" y="200" font-size="10" fill="#666">    L2 stays UD(0xAAA), NOT downgraded to SC (ReadOnce doesn't trigger SnpShared)</text>
  <text x="20" y="215" font-size="10" fill="#666">P3: 5M timer expires → pendingOp=0. Node1 reads again → recall → funcRead gets 0xAAA from L2 → FAIL (expected 0xBBB)</text>
  <text x="20" y="230" font-size="10" fill="#666">    Node0's 0xBBB was written locally (L2 had UD), never reached phys_mem → stale data</text>
</svg>
