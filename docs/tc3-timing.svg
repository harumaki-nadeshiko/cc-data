<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="monospace" font-size="12">
  <text x="450" y="20" text-anchor="middle" font-size="14" font-weight="bold">TC3: Ping-Pong Deadlock</text>

  <!-- Participants -->
  <rect x="10" y="35" width="90" height="20" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="55" y="50" text-anchor="middle" font-size="10">Node0 CPU</text>

  <rect x="10" y="65" width="90" height="20" rx="3" fill="#fff3e0" stroke="#e65100"/>
  <text x="55" y="80" text-anchor="middle" font-size="10">UBCC@N1</text>

  <rect x="10" y="95" width="90" height="20" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="55" y="110" text-anchor="middle" font-size="10">Node1 CPU</text>

  <!-- Timeline -->
  <line x1="110" y1="55" x2="880" y2="55" stroke="#ddd" stroke-width="1"/>
  <line x1="110" y1="75" x2="880" y2="75" stroke="#ddd" stroke-width="1"/>
  <line x1="110" y1="105" x2="880" y2="105" stroke="#ddd" stroke-width="1"/>

  <!-- T0: Node0 writes -->
  <rect x="130" y="33" width="120" height="24" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="190" y="50" text-anchor="middle" font-size="10">write 0xA →</text>

  <rect x="255" y="63" width="150" height="24" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="330" y="80" text-anchor="middle" font-size="10">grant M, pendingOp=3, req=N0</text>

  <!-- T1: Node1 read blocked -->
  <rect x="440" y="93" width="100" height="24" rx="3" fill="#ffcdd2" stroke="#c62828"/>
  <text x="490" y="110" text-anchor="middle" font-size="10">read → blocked!</text>

  <rect x="545" y="63" width="130" height="24" rx="3" fill="#ffcdd2" stroke="#c62828"/>
  <text x="610" y="80" text-anchor="middle" font-size="10">diff req → dummy S</text>

  <!-- T2: Node1 write deadlock -->
  <rect x="710" y="93" width="130" height="24" rx="3" fill="#d32f2f" stroke="#b71c1c"/>
  <text x="775" y="110" text-anchor="middle" font-size="10" fill="white">write → ❌ DEAD</text>

  <rect x="710" y="63" width="130" height="24" rx="3" fill="#ffcdd2" stroke="#c62828"/>
  <text x="775" y="80" text-anchor="middle" font-size="10">still blocked!</text>

  <!-- Explanation -->
  <text x="20" y="145" font-size="10" fill="#666">T0: Node0 writes 0xA → UBCC grants Modified, sets pendingOp=3, pendingRequester=0</text>
  <text x="20" y="160" font-size="10" fill="#666">T1: Node1 reads → UBCC sees pendingOp=3, requester=1≠0 → returns dummy Shared</text>
  <text x="20" y="175" font-size="10" fill="#666">T2: Node1 writes → UBCC still blocked → CPU waits for Modified grant forever → ❌ Sequencer Deadlock</text>
</svg>
