<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 900" font-family="monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#28a745"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc3545"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6f42c1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1150" height="900" fill="#fafafa" rx="12"/>
  <text x="575" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">CC-EP Target Multi-Process Distributed Architecture</text>

  <!-- launcher.py Orchestrator -->
  <rect x="40" y="70" width="1070" height="65" rx="6" fill="#ffffff" stroke="#555" stroke-dasharray="4,2"/>
  <text x="575" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">launcher.py (Central Process Orchestrator &amp; Monitor)</text>
  <text x="575" y="110" text-anchor="middle" font-size="10" fill="#555">Parses Topology JSON | Distributes Config Slices | Manages Process Lifecycles | Shuts Down Cluster on gem5 normal Exit</text>

  <!-- Node 0: gem5 Process -->
  <rect x="50" y="160" width="310" height="240" rx="8" fill="#eafaf1" stroke="#28a745" stroke-width="2"/>
  <text x="205" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a6b30">gem5 Process (Node 0)</text>
  <text x="205" y="202" text-anchor="middle" font-size="9" fill="#28a745">🟢 NEW: INDEPENDENT SIMULATION PROCESS</text>

  <rect x="65" y="220" width="130" height="30" rx="4" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <text x="130" y="240.5" text-anchor="middle" font-size="11" fill="#2a5a8a">CPU &amp; L1/L2</text>

  <rect x="205" y="220" width="140" height="30" rx="4" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <text x="275" y="240.5" text-anchor="middle" font-size="11" fill="#2a5a8a">RubySystem &amp; CHI</text>

  <rect x="65" y="260" width="130" height="30" rx="4" fill="#fff9e6" stroke="#ffc107" stroke-width="1"/>
  <text x="130" y="280.5" text-anchor="middle" font-size="11" fill="#8a6d00">EPBackend</text>

  <rect x="205" y="260" width="140" height="30" rx="4" fill="#fff9e6" stroke="#ffc107" stroke-width="1"/>
  <text x="275" y="280.5" text-anchor="middle" font-size="11" fill="#8a6d00">UBAdapter</text>

  <rect x="65" y="300" width="280" height="30" rx="4" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <text x="205" y="320.5" text-anchor="middle" font-size="11" fill="#2a5a8a">MetaRNF Proxy &amp; HN-F Planes</text>

  <rect x="65" y="345" width="280" height="40" rx="4" fill="#eafaf1" stroke="#28a745" stroke-dasharray="2,2"/>
  <text x="205" y="369.5" text-anchor="middle" font-size="11" fill="#1a6b30">🟢 Port (ZMQ PAIR IPC Socket)</text>


  <!-- Node 0: UBIOModule Process -->
  <rect x="50" y="470" width="310" height="240" rx="8" fill="#f5f0ff" stroke="#6f42c1" stroke-width="2"/>
  <text x="205" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#6f42c1">UBIOModule Process (Node 0)</text>
  <text x="205" y="512" text-anchor="middle" font-size="9" fill="#6f42c1">🟣 RELOCATED: INDEPENDENT COHERENCE PROCESS</text>

  <rect x="65" y="525" width="280" height="30" rx="4" fill="#f0e6ff" stroke="#6f42c1" stroke-width="1"/>
  <text x="205" y="545.5" text-anchor="middle" font-size="11" fill="#6f42c1">🟣 Port 0 (ZMQ PAIR IPC to gem5)</text>

  <rect x="65" y="565" width="280" height="60" rx="4" fill="#f0e6ff" stroke="#6f42c1" stroke-width="1"/>
  <text x="205" y="588" text-anchor="middle" font-size="11" font-weight="bold" fill="#6f42c1">UBCC Coherence Engine</text>
  <text x="205" y="608" text-anchor="middle" font-size="10" fill="#333">ResidentDir | Single-flight &amp; replay queues</text>

  <rect x="65" y="635" width="280" height="40" rx="4" fill="#f0e6ff" stroke="#6f42c1" stroke-dasharray="2,2"/>
  <text x="205" y="660.5" text-anchor="middle" font-size="11" fill="#6f42c1">🟣 Port 1 (ZMQ PAIR IPC to NetSim)</text>


  <!-- Node 1: gem5 Process -->
  <rect x="790" y="160" width="310" height="240" rx="8" fill="#eafaf1" stroke="#28a745" stroke-width="2"/>
  <text x="945" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a6b30">gem5 Process (Node 1)</text>
  <text x="945" y="202" text-anchor="middle" font-size="9" fill="#28a745">🟢 NEW: INDEPENDENT SIMULATION PROCESS</text>

  <rect x="805" y="220" width="130" height="30" rx="4" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <text x="870" y="240.5" text-anchor="middle" font-size="11" fill="#2a5a8a">CPU &amp; L1/L2</text>

  <rect x="945" y="220" width="140" height="30" rx="4" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <text x="1015" y="240.5" text-anchor="middle" font-size="11" fill="#2a5a8a">RubySystem &amp; CHI</text>

  <rect x="805" y="260" width="130" height="30" rx="4" fill="#fff9e6" stroke="#ffc107" stroke-width="1"/>
  <text x="870" y="280.5" text-anchor="middle" font-size="11" fill="#8a6d00">EPBackend</text>

  <rect x="945" y="260" width="140" height="30" rx="4" fill="#fff9e6" stroke="#ffc107" stroke-width="1"/>
  <text x="1015" y="280.5" text-anchor="middle" font-size="11" fill="#8a6d00">UBAdapter</text>

  <rect x="805" y="300" width="280" height="30" rx="4" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <text x="945" y="320.5" text-anchor="middle" font-size="11" fill="#2a5a8a">MetaRNF Proxy &amp; HN-F Planes</text>

  <rect x="805" y="345" width="280" height="40" rx="4" fill="#eafaf1" stroke="#28a745" stroke-dasharray="2,2"/>
  <text x="945" y="369.5" text-anchor="middle" font-size="11" fill="#1a6b30">🟢 Port (ZMQ PAIR IPC Socket)</text>


  <!-- Node 1: UBIOModule Process -->
  <rect x="790" y="470" width="310" height="240" rx="8" fill="#f5f0ff" stroke="#6f42c1" stroke-width="2"/>
  <text x="945" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#6f42c1">UBIOModule Process (Node 1)</text>
  <text x="945" y="512" text-anchor="middle" font-size="9" fill="#6f42c1">🟣 RELOCATED: INDEPENDENT COHERENCE PROCESS</text>

  <rect x="805" y="525" width="280" height="30" rx="4" fill="#f0e6ff" stroke="#6f42c1" stroke-width="1"/>
  <text x="945" y="545.5" text-anchor="middle" font-size="11" fill="#6f42c1">🟣 Port 0 (ZMQ PAIR IPC to gem5)</text>

  <rect x="805" y="565" width="280" height="60" rx="4" fill="#f0e6ff" stroke="#6f42c1" stroke-width="1"/>
  <text x="945" y="588" text-anchor="middle" font-size="11" font-weight="bold" fill="#6f42c1">UBCC Coherence Engine</text>
  <text x="945" y="608" text-anchor="middle" font-size="10" fill="#333">ResidentDir | Single-flight &amp; replay queues</text>

  <rect x="805" y="635" width="280" height="40" rx="4" fill="#f0e6ff" stroke="#6f42c1" stroke-dasharray="2,2"/>
  <text x="945" y="660.5" text-anchor="middle" font-size="11" fill="#6f42c1">🟣 Port 1 (ZMQ PAIR IPC to NetSim)</text>


  <!-- NetworkSim Central forwarding Process -->
  <rect x="400" y="560" width="350" height="150" rx="8" fill="#fff9e6" stroke="#ffc107" stroke-width="2.5"/>
  <text x="575" y="585" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d00">NetworkSim Central Forwarding Process</text>
  <text x="575" y="602" text-anchor="middle" font-size="9" fill="#8a6d00">🟡 NEW: STAR-TOPOLOGY PACKET ROUTER</text>

  <rect x="415" y="615" width="320" height="80" rx="4" fill="#fffdf3" stroke="#ffc107" stroke-width="1"/>
  <text x="575" y="635" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">Per-Link FIFO Queues &amp; Latency Model</text>
  <text x="575" y="655" text-anchor="middle" font-size="10" fill="#555">Reads static topology JSON from launcher</text>
  <text x="575" y="675" text-anchor="middle" font-size="10" fill="#555">Pure transport forwarding (no coherence parsing)</text>


  <!-- Inter-Process IPC Connections -->

  <!-- gem5 <-> ubio Node 0 -->
  <path d="M 205,385 L 205,525" stroke="#28a745" stroke-width="3" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <rect x="135" y="423" width="140" height="24" rx="3" fill="#ffffff" stroke="#28a745" stroke-width="1"/>
  <text x="205" y="439" text-anchor="middle" font-size="10" fill="#1a6b30" font-weight="bold">ZMQ IPC (Port 0)</text>

  <!-- gem5 <-> ubio Node 1 -->
  <path d="M 945,385 L 945,525" stroke="#28a745" stroke-width="3" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <rect x="875" y="423" width="140" height="24" rx="3" fill="#ffffff" stroke="#28a745" stroke-width="1"/>
  <text x="945" y="439" text-anchor="middle" font-size="10" fill="#1a6b30" font-weight="bold">ZMQ IPC (Port 0)</text>

  <!-- ubio Node 0 <-> NetworkSim -->
  <path d="M 345,655 L 400,655" stroke="#dc3545" stroke-width="3" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="372.5" y="648" text-anchor="middle" font-size="10" fill="#dc3545" font-weight="bold">ZMQ IPC</text>

  <!-- ubio Node 1 <-> NetworkSim -->
  <path d="M 790,655 L 750,655" stroke="#dc3545" stroke-width="3" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="770" y="648" text-anchor="middle" font-size="10" fill="#dc3545" font-weight="bold">ZMQ IPC</text>


  <!-- Orchestration Control Flow (thin dashed gray lines) -->
  <path d="M 205,135 L 205,160" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 945,135 L 945,160" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M 575,135 L 575,560" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>


  <!-- Legend -->
  <rect x="40" y="735" width="1070" height="135" rx="8" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <text x="60" y="757" font-size="12" font-weight="bold" fill="#333">Distributed Process Role &amp; Communication Legend</text>

  <rect x="60" y="775" width="20" height="15" rx="3" fill="#eafaf1" stroke="#28a745" stroke-width="1"/>
  <text x="90" y="787" font-size="11" fill="#333">🟢 gem5 Process &amp; Ports (Core CPU/Cache execution and transport adapter layers)</text>

  <rect x="60" y="800" width="20" height="15" rx="3" fill="#f5f0ff" stroke="#6f42c1" stroke-width="1"/>
  <text x="90" y="812" font-size="11" fill="#333">🟣 UBIOModule Process (Independent coherence protocol engine containing ResidentDir)</text>

  <rect x="60" y="825" width="20" height="15" rx="3" fill="#fff9e6" stroke="#ffc107" stroke-width="1"/>
  <text x="90" y="837" font-size="11" fill="#333">🟡 NetworkSim Process (Star-topology network emulator providing latency and FIFO ordering)</text>

  <line x1="680" y1="783" x2="710" y2="783" stroke="#28a745" stroke-width="3"/>
  <text x="720" y="787" font-size="11" fill="#333">Local Node IPC Port Connection (Duplex ZMQ PAIR)</text>

  <line x1="680" y1="808" x2="710" y2="808" stroke="#dc3545" stroke-width="3"/>
  <text x="720" y="812" font-size="11" fill="#333">Inter-Node network IPC Connection (Duplex ZMQ PAIR)</text>

  <line x1="680" y1="833" x2="710" y2="833" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="720" y="837" font-size="11" fill="#333">launcher.py Process Lifecycle and Config Distribution Path</text>
</svg>
