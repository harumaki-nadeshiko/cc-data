<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 880" font-family="monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a90d9"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#28a745"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc3545"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6f42c1"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#fd7e14"/>
    </marker>
  </defs>

  <rect width="1150" height="880" fill="#fafafa" rx="12"/>
  <text x="575" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">CC-EP 单 gem5 进程 — 双 Socket 架构 (num_sockets=2)</text>

  <!-- ============================================================ -->
  <!-- gem5 Process Boundary -->
  <!-- ============================================================ -->
  <rect x="20" y="55" width="1110" height="620" rx="10" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="8,3"/>
  <text x="40" y="80" font-size="13" font-weight="bold" fill="#555">gem5 进程 (统一事件循环 &amp; 内存空间)</text>

  <!-- ============================================================ -->
  <!-- Per-Node Shared Layer -->
  <!-- ============================================================ -->
  <rect x="40" y="100" width="1070" height="100" rx="8" fill="#f5f0ff" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="60" y="125" font-size="13" font-weight="bold" fill="#6f42c1">Per-Node Shared (单例, Socket 0 + Socket 1 共享)</text>

  <rect x="60" y="138" width="150" height="36" rx="4" fill="#fff9e6" stroke="#ffc107" stroke-width="1.5"/>
  <text x="135" y="161.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d00">EPBackend</text>

  <rect x="230" y="138" width="210" height="36" rx="4" fill="#f0e6ff" stroke="#6f42c1" stroke-width="2"/>
  <text x="335" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="#6f42c1">UBCCController + ResidentDir</text>
  <text x="335" y="167" text-anchor="middle" font-size="9" fill="#6f42c1">BloomFilter + GroupIndex</text>

  <rect x="460" y="138" width="120" height="36" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="520" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a6b30">EPRNF</text>
  <text x="520" y="167" text-anchor="middle" font-size="9" fill="#1a6b30">Snoop Handler</text>

  <rect x="600" y="138" width="490" height="36" rx="4" fill="#f8f9fa" stroke="#ccc" stroke-width="1"/>
  <text x="845" y="153" text-anchor="middle" font-size="11" fill="#555">跨节点: EPBackend::_backendInstances 全局注册表 → Recall/Invalidate 路由</text>
  <text x="845" y="167" text-anchor="middle" font-size="9" fill="#777">static registry per-node index → 远端 EPBackend → EPRNF → HN-F</text>

  <!-- EPBackend ↔ UBCCController -->
  <line x1="210" y1="156" x2="230" y2="156" stroke="#6f42c1" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <!-- EPRNF → EPBackend -->
  <line x1="460" y1="156" x2="380" y2="156" stroke="#28a745" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ============================================================ -->
  <!-- Socket 0 (left) -->
  <!-- ============================================================ -->
  <rect x="40" y="215" width="515" height="260" rx="8" fill="#f4f9ff" stroke="#4a90d9" stroke-width="2"/>
  <text x="60" y="240" font-size="13" font-weight="bold" fill="#2a5a8a">Socket 0</text>

  <!-- Row 1: CPU / L1L2 / RubyCHI / HN-F -->
  <rect x="60" y="255" width="70" height="32" rx="4" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <text x="95" y="275.5" text-anchor="middle" font-size="10" fill="#2a5a8a">CPU</text>

  <rect x="140" y="255" width="75" height="32" rx="4" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <text x="177" y="275.5" text-anchor="middle" font-size="10" fill="#2a5a8a">L1/L2</text>

  <rect x="225" y="255" width="80" height="32" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="265" y="275.5" text-anchor="middle" font-size="10" fill="#1a6b30">Ruby/CHI</text>

  <rect x="315" y="255" width="100" height="32" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="365" y="268" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a6b30">HN-F</text>
  <text x="365" y="281" text-anchor="middle" font-size="7" fill="#1a6b30">L3+CHI HomeNode</text>

  <!-- Socket 0 row 1 arrows -->
  <line x1="130" y1="271" x2="140" y2="271" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="215" y1="271" x2="225" y2="271" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="305" y1="271" x2="315" y2="271" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Row 2: EPSNF / MetaRNF / UBAdapter / UBIOModule -->
  <rect x="60" y="300" width="105" height="32" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="112" y="313" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a6b30">EPSNF</text>
  <text x="112" y="325" text-anchor="middle" font-size="7" fill="#1a6b30">DSM Data Srv</text>

  <rect x="175" y="300" width="105" height="32" rx="4" fill="#d1ecf1" stroke="#17a2b8" stroke-width="1"/>
  <text x="227" y="313" text-anchor="middle" font-size="9" font-weight="bold" fill="#0c5460">MetaRNF</text>
  <text x="227" y="325" text-anchor="middle" font-size="7" fill="#0c5460">Metadata I/O</text>

  <rect x="290" y="300" width="105" height="32" rx="4" fill="#fff9e6" stroke="#ffc107" stroke-width="1"/>
  <text x="342" y="313" text-anchor="middle" font-size="9" font-weight="bold" fill="#8a6d00">UBAdapter</text>
  <text x="342" y="325" text-anchor="middle" font-size="7" fill="#8a6d00">Transport Fac.</text>

  <rect x="405" y="300" width="130" height="32" rx="4" fill="#f0e6ff" stroke="#6f42c1" stroke-width="1"/>
  <text x="470" y="313" text-anchor="middle" font-size="9" font-weight="bold" fill="#6f42c1">UBIOModule</text>
  <text x="470" y="325" text-anchor="middle" font-size="7" fill="#6f42c1">Router</text>

  <!-- Row 3: DDR4 -->
  <rect x="60" y="345" width="415" height="36" rx="4" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="267" y="360" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a1a1a">DDR4 DRAM (MemCtrl + DDR4_2400_8x8)</text>
  <text x="267" y="373" text-anchor="middle" font-size="8" fill="#8a1a1a">PA range: [0x2_0000_0000, 0x2_0800_0000)</text>

  <!-- Socket 0 row 2 arrows (internal) -->
  <line x1="365" y1="287" x2="365" y2="300" stroke="#28a745" stroke-width="1" marker-end="url(#arr-green)"/>
  <line x1="227" y1="300" x2="365" y2="287" stroke="#17a2b8" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="342" y1="300" x2="405" y2="300" stroke="#6f42c1" stroke-width="1" marker-end="url(#arr-purple)"/>

  <!-- HN-F → DDR4 (via SNF) -->
  <path d="M 365,287 L 267,345" stroke="#dc3545" stroke-width="1" marker-end="url(#arr-red)"/>
  <!-- MetaRNF → DDR4 -->
  <line x1="227" y1="332" x2="227" y2="345" stroke="#dc3545" stroke-width="1" marker-end="url(#arr-red)"/>

  <!-- EPSNF → EPBackend (handleRemoteMiss) -->
  <path d="M 112,300 L 112,174" stroke="#ffc107" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <!-- EPBackend → UBAdapter -->
  <path d="M 135,174 L 135,220 L 342,220 L 342,300" stroke="#ffc107" stroke-width="1" marker-end="url(#arr)"/>
  <!-- HN-F → EPRNF (snoop) -->
  <path d="M 365,255 L 365,215 L 520,215 L 520,174" stroke="#28a745" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
  <!-- EPRNF → HN-F (CHI) -->
  <path d="M 520,174 L 520,205 L 365,205 L 365,255" stroke="#28a745" stroke-width="1" marker-end="url(#arr-green)"/>

  <!-- num_sockets=1 annotation -->
  <text x="60" y="460" font-size="8" fill="#888">num_sockets=1 时退化: Socket1 禁用</text>

  <!-- ============================================================ -->
  <!-- Socket 1 (right) — symmetric to Socket 0 -->
  <!-- ============================================================ -->
  <rect x="575" y="215" width="515" height="260" rx="8" fill="#f4f9ff" stroke="#4a90d9" stroke-width="2"/>
  <text x="595" y="240" font-size="13" font-weight="bold" fill="#2a5a8a">Socket 1</text>

  <!-- Row 1 -->
  <rect x="595" y="255" width="70" height="32" rx="4" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <text x="630" y="275.5" text-anchor="middle" font-size="10" fill="#2a5a8a">CPU</text>

  <rect x="675" y="255" width="75" height="32" rx="4" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <text x="712" y="275.5" text-anchor="middle" font-size="10" fill="#2a5a8a">L1/L2</text>

  <rect x="760" y="255" width="80" height="32" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="800" y="275.5" text-anchor="middle" font-size="10" fill="#1a6b30">Ruby/CHI</text>

  <rect x="850" y="255" width="100" height="32" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="900" y="268" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a6b30">HN-F</text>
  <text x="900" y="281" text-anchor="middle" font-size="7" fill="#1a6b30">L3+CHI HomeNode</text>

  <!-- Socket 1 row 1 arrows -->
  <line x1="665" y1="271" x2="675" y2="271" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="750" y1="271" x2="760" y2="271" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="840" y1="271" x2="850" y2="271" stroke="#333" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Row 2 -->
  <rect x="595" y="300" width="105" height="32" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="647" y="313" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a6b30">EPSNF</text>
  <text x="647" y="325" text-anchor="middle" font-size="7" fill="#1a6b30">DSM Data Srv</text>

  <rect x="710" y="300" width="105" height="32" rx="4" fill="#d1ecf1" stroke="#17a2b8" stroke-width="1"/>
  <text x="762" y="313" text-anchor="middle" font-size="9" font-weight="bold" fill="#0c5460">MetaRNF</text>
  <text x="762" y="325" text-anchor="middle" font-size="7" fill="#0c5460">Metadata I/O</text>

  <rect x="825" y="300" width="105" height="32" rx="4" fill="#fff9e6" stroke="#ffc107" stroke-width="1"/>
  <text x="877" y="313" text-anchor="middle" font-size="9" font-weight="bold" fill="#8a6d00">UBAdapter</text>
  <text x="877" y="325" text-anchor="middle" font-size="7" fill="#8a6d00">Transport Fac.</text>

  <rect x="940" y="300" width="130" height="32" rx="4" fill="#f0e6ff" stroke="#6f42c1" stroke-width="1"/>
  <text x="1005" y="313" text-anchor="middle" font-size="9" font-weight="bold" fill="#6f42c1">UBIOModule</text>
  <text x="1005" y="325" text-anchor="middle" font-size="7" fill="#6f42c1">Router</text>

  <!-- Row 3: DDR4 -->
  <rect x="595" y="345" width="415" height="36" rx="4" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="802" y="360" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a1a1a">DDR4 DRAM (MemCtrl + DDR4_2400_8x8)</text>
  <text x="802" y="373" text-anchor="middle" font-size="8" fill="#8a1a1a">PA range: [0x2_0800_0000, 0x2_1000_0000)</text>

  <!-- Socket 1 row 2 arrows -->
  <line x1="900" y1="287" x2="900" y2="300" stroke="#28a745" stroke-width="1" marker-end="url(#arr-green)"/>
  <line x1="762" y1="300" x2="900" y2="287" stroke="#17a2b8" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="877" y1="300" x2="940" y2="300" stroke="#6f42c1" stroke-width="1" marker-end="url(#arr-purple)"/>

  <!-- HN-F → DDR4 (via SNF) -->
  <path d="M 900,287 L 802,345" stroke="#dc3545" stroke-width="1" marker-end="url(#arr-red)"/>
  <!-- MetaRNF → DDR4 -->
  <line x1="762" y1="332" x2="762" y2="345" stroke="#dc3545" stroke-width="1" marker-end="url(#arr-red)"/>

  <!-- EPSNF → EPBackend -->
  <path d="M 647,300 L 647,174" stroke="#ffc107" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <!-- EPBackend → UBAdapter -->
  <path d="M 135,174 L 135,220 L 877,220 L 877,300" stroke="#ffc107" stroke-width="1" marker-end="url(#arr)"/>
  <!-- HN-F → EPRNF (snoop) -->
  <path d="M 900,255 L 900,215 L 520,215 L 520,174" stroke="#28a745" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
  <!-- EPRNF → HN-F (CHI) -->
  <path d="M 520,174 L 520,205 L 900,205 L 900,255" stroke="#28a745" stroke-width="1" marker-end="url(#arr-green)"/>

  <!-- num_sockets=1 annotation -->
  <text x="595" y="460" font-size="8" fill="#888">num_sockets=1 时退化: Socket1 禁用</text>

  <!-- ============================================================ -->
  <!-- Socket-Link (between HN-Fs) -->
  <!-- ============================================================ -->
  <path d="M 415,265 L 540,265 L 540,285 L 810,285 L 810,265" stroke="#dc3545" stroke-width="2" fill="none" stroke-dasharray="5,2"/>
  <rect x="540" y="255" width="130" height="18" rx="3" fill="#ffffff" stroke="#dc3545" stroke-width="1"/>
  <text x="605" y="268" text-anchor="middle" font-size="9" font-weight="bold" fill="#dc3545">Socket-Link (CHI)</text>

  <!-- UBIOModule Socket 0 → Shared UBCC (data flow) -->
  <path d="M 470,300 L 470,220 L 335,220 L 335,174" stroke="#6f42c1" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-purple)"/>
  <!-- UBIOModule Socket 1 → Shared UBCC -->
  <path d="M 1005,300 L 1005,220 L 335,220 L 335,174" stroke="#6f42c1" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-purple)"/>

  <!-- ============================================================ -->
  <!-- Node 1..N -->
  <!-- ============================================================ -->
  <rect x="40" y="485" width="1070" height="75" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="510" font-size="13" font-weight="bold" fill="#555">Node 1 .. N (同构, 每 node 含 2 socket)</text>
  <text x="60" y="530" font-size="11" fill="#777">每个 node: 独立 EPBackend + UBCCController + ResidentDir + EPRNF + 2 socket (同 Socket 0/1 结构)</text>
  <text x="60" y="548" font-size="11" fill="#777">跨节点: EPBackend::_backendInstances 静态注册表 → distant recall/invalidate → 远端 EPBackend → EPRNF → HN-F</text>

  <line x1="575" y1="475" x2="575" y2="485" stroke="#dc3545" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- ============================================================ -->
  <!-- DDR4 access paths panel -->
  <!-- ============================================================ -->
  <rect x="40" y="580" width="1070" height="80" rx="8" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <text x="60" y="603" font-size="12" font-weight="bold" fill="#333">DDR4 访问</text>
  <text x="60" y="622" font-size="11" fill="#555">CHI 协议路径: HN-F → SNF → MemCtrl → DDR4_2400_8x8 (cache miss / MetaRNF metadata I/O)</text>
  <text x="60" y="640" font-size="11" fill="#555">功能访问路径: EPBackend → RubySystem::getPhysMem() → functionalAccess (grant 数据填充 / NCBWrData 写回)</text>

  <!-- ============================================================ -->
  <!-- Legend -->
  <!-- ============================================================ -->
  <rect x="40" y="680" width="1070" height="175" rx="8" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <text x="60" y="702" font-size="12" font-weight="bold" fill="#333">图例</text>

  <rect x="60" y="715" width="22" height="14" rx="3" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1"/>
  <text x="90" y="727" font-size="11" fill="#333">CPU / L1 / L2</text>

  <rect x="300" y="715" width="22" height="14" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="330" y="727" font-size="11" fill="#333">Ruby/CHI + HN-F + EPSNF + EPRNF</text>

  <rect x="620" y="715" width="22" height="14" rx="3" fill="#fff9e6" stroke="#ffc107" stroke-width="1"/>
  <text x="650" y="727" font-size="11" fill="#333">EPBackend / UBAdapter</text>

  <rect x="60" y="740" width="22" height="14" rx="3" fill="#f5f0ff" stroke="#6f42c1" stroke-width="1"/>
  <text x="90" y="752" font-size="11" fill="#333">UBCCController / UBIOModule / ResidentDir (Per-Node Shared)</text>

  <rect x="470" y="740" width="22" height="14" rx="3" fill="#d1ecf1" stroke="#17a2b8" stroke-width="1"/>
  <text x="500" y="752" font-size="11" fill="#333">MetaRNF (Metadata Backstore I/O)</text>

  <rect x="60" y="765" width="22" height="14" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="90" y="777" font-size="11" fill="#333">DDR4 / DRAM</text>

  <line x1="240" y1="722" x2="270" y2="722" stroke="#dc3545" stroke-width="2" stroke-dasharray="5,2"/>
  <text x="280" y="727" font-size="11" fill="#333">Socket-Link (CHI Coherence Forwarding)</text>

  <line x1="240" y1="747" x2="270" y2="747" stroke="#dc3545" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="280" y="752" font-size="11" fill="#333">跨节点路由 (inter-node)</text>

  <line x1="240" y1="772" x2="270" y2="772" stroke="#ffc107" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="280" y="777" font-size="11" fill="#333">EPSNF → EPBackend 异步通知</text>

  <rect x="470" y="765" width="22" height="14" rx="3" fill="none" stroke="none"/>
  <text x="500" y="777" font-size="10" fill="#888">注: 所有 per-socket 组件 (UBAdapter, UBIOModule, EPSNF, MetaRNF, HN-F, DDR4) 都各自独立，</text>
  <text x="500" y="792" font-size="10" fill="#888">通过 per-node shared (EPBackend, UBCC, EPRNF) 协调。ubio 多进程阶段每 socket UBIOModule 独立进程。</text>
</svg>
