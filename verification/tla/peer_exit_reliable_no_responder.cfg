\* Negative control: simultaneous exits plus one transient loss can leave a
\* late Notify addressed to a peer whose responder was torn down. TLC must
\* report a temporal-property violation.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANT Nodes = {0, 1}
CONSTANT MaxDrops = 1
CONSTANT MaxDups = 0
CONSTANT MaxStaleAcks = 0
CONSTANT MaxQueue = 2
CONSTANT RetryRounds = 1
CONSTANT DeliveryRounds = 1
CONSTANT QuiesceRounds = 0
CONSTANT ImmediateClose = TRUE
CONSTANT ExitMode = "Simultaneous"
INVARIANT TypeOK QueueBound StableGeneration NoPrematureExit AckAuthentic
PROPERTY AllExit StartedExitProgress
