\* Liveness config: verifies progress properties under FairSpec WITH the
\* RecallOrphanCleanup safety net present (see Next in ubcc_protocol_core.tla).
\* Expected result: PASS (no liveness violation).
\*
\* Small scope on purpose: liveness checking does a two-pass (safety + SCC/
\* lasso) search that is far more expensive than invariant checking, so we
\* shrink MaxEpoch and TombstoneWindow. RecallTimeout=2 keeps the orphan
\* cleanup reachable well inside MaxTick.
SPECIFICATION FairSpec
CONSTANT Nodes = {0, 1, 2}
CONSTANT MaxEpoch = 2
CONSTANT TombstoneWindow = 3
INVARIANT SharersCanonical
INVARIANT EpochMonotonic
INVARIANT NoDoubleCommit
INVARIANT ReserveNotCommit
PROPERTY RecallProgress
PROPERTY OstEventuallyClears
PROPERTY InvalidateProgress
PROPERTY UpgradeProgress
