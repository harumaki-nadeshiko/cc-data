\* B3: liveness under the extended fault model. Verifies that even with
\* drop/duplicate/reorder of control messages, no RECALL wedges the PA slot
\* forever (orphan cleanup rescues lost responses). Expected: PASS.
\*
\* Small scope (like ubcc_liveness.cfg) because liveness = expensive SCC search.
SPECIFICATION TFFairSpec
CONSTANT Nodes = {0, 1, 2}
CONSTANT MaxEpoch = 2
CONSTANT TombstoneWindow = 3
INVARIANT FaultDirCanonical
INVARIANT FaultNoDoubleCommit
PROPERTY FaultRecallProgress
PROPERTY FaultUpgradeRecovery
